services:
  - type: web
    name: smartronics
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET_PHRASE
        sync: false
      - key: SESSION_SECRET
        sync: false 